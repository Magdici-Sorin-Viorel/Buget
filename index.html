<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buget Familie</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121216">
<meta name="description" content="Bugetul casei, ținut pe calculatorul tău. Fără cont, fără internet, fără ca datele să plece undeva.">
<!-- Everything is served from this folder; no data ever leaves the computer. -->
<link rel="stylesheet" href="lib/fontawesome/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="lib/chart.umd.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-logo"><span style="font-size:1.5rem">💰</span><span class="nm">Buget Familie</span></div>
    <nav id="nav" style="padding:6px 0;flex:1;"></nav>
    <div class="sb-foot" id="sbFoot"></div>
  </aside>
  <main class="main"><div id="pg"></div></main>
</div>

<!-- Load order matters: cats/storage → core → ui → pages → app -->
<script src="lib/xlsx.full.min.js" defer></script>
<script src="js/cats.js"></script>
<script src="js/storage.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/expenses.js"></script>
<script src="js/incomes.js"></script>
<script src="js/budget.js"></script>
<script src="js/stats.js"></script>
<script src="js/savings.js"></script>
<script src="js/settings.js"></script>
<script src="js/welcome.js"></script>
<script src="js/exportxls.js"></script>
<script src="js/app.js"></script>
<script>
  // Offline + installable. Only when the page is served over http(s) — not when opened from a file.
  if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
</script>
</body>
</html>
